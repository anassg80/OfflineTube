<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfflineTube</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <h1>OfflineTube 🎬</h1>

  <div class="input-container">
    <input type="file" id="videoInput" accept="video/*" multiple style="display: none;" onchange="handleFileSelect(event)">
    <button class="btn" onclick="document.getElementById('videoInput').click()">📁 Choisir une vidéo</button>
  </div>

  <input type="text" id="searchInput" placeholder="🔍 Rechercher une vidéo..." oninput="filterVideos()">

  <div class="player-container">
    <video id="mainPlayer" controls style="display: none;"></video>
  </div>

  <h2>Mes Vidéos</h2>
  <div id="videoList" class="video-list"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
