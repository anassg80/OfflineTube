<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfflineTube</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OfflineTube">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>OfflineTube 📺</h1>

  <div id="statusBadge" class="status-badge">
    🌐 Connecté (Prêt pour la synchronisation Wi-Fi)
  </div>

  <div class="card">
    <h3>Ajouter une vidéo à la mémoire locale</h3>
    <input type="file" id="videoInput" accept="video/*" multiple onchange="handleFileSelect(event)">
  </div>

  <h2>Vidéos enregistrées (Accessibles sans Wi-Fi)</h2>
  <hr class="separator">

  <input type="text" id="searchInput" placeholder="🔍 Rechercher une vidéo..." oninput="filterVideos()">

  <div id="videoList"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
